name: Publish synthetic OpenExpense demo
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      # No backend, workbook, statements, credentials or data exports are loaded.
      - run: npm run build:demo --prefix frontend
      - name: Check public artifact
        run: node scripts/check-public.mjs frontend/dist-demo
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist-demo
  deploy:
    if: github.repository == 'pebblepaw/OpenExpense'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
