# OpenExpense settings. Never add personal identifiers to this tracked defaults file.
# Copy config/config.yaml.example to config/config.yaml for private local settings.
# Category IDs are stable; customize names, aliases, colors and rules below.
version: 1
app:
  name: OpenExpense
  personal_label: Personal
  locale: en-SG
  default_category: food
  chart:
    max_categories: 6
    minimum_category_share: 0.025
    other_label: Other
analysis:
  start_date: 2026-01-01
  end_date: null
  baseline_date: 2026-07-31
forecast:
  income_average_start_month: 2026-05
  recent_months: 3
  target_month: null
  slider_step: 50
  slider_max: 6000
workbook: ./master_transactions.xlsx
merchant_directory: ./config/merchant_directory.csv
sources:
  dbs: ./POSB:DBS Bank Statement
  paylah: ./PayLah
  revolut: ./Revolut
source_labels:
  dbs-csv: DBS/POSB
  dbs-pdf: DBS/POSB
  paylah-pdf: PayLah Wallet
  revolut-csv: Revolut
assumed_closing_balances:
  paylah-pdf: 0
  revolut-csv: 0
accounts: {}
account_holder_patterns: []
revolut_account_patterns: []
known_income_patterns:
  - GOVTECH
  - GOVERNMENT TECHNOLOGY AGENCY
  - MINDEF
  - SAF
income_sources:
  Salary:
    - GOVTECH
    - GOVERNMENT TECHNOLOGY AGENCY
  Tuition:
    - TCIMO
  Army payments:
    - MINDEF
    - SAF
  Interest:
    - INTEREST EARNED
income_fallback_label: Other income
relationship_account:
  account_id: JOINT_ACCOUNT_ID
  account_name: Joint Account
  user_label: You
  partner_label: Partner
  other_contributor_label: Partner / other
  start_date: null
  personal_funding_account_ids: []
  partner_funding_account_ids: []
transfer_matching:
  max_calendar_days: 3
  amount_tolerance_sgd: 0.01
categories:
  food:
    name: Food & Dining
    aliases:
      - Food & Dining
    color: var(--chart-1)
    subcategories: [] # Amount-band names below provide the dropdown options.
    amount_bands:
      - min: 50
        name: Really big meals ($50+)
      - min: 20
        name: Big meals ($20–$49.99)
      - min: 0
        name: Other meals (<$20)
  groceries:
    name: Groceries
    aliases:
      - Groceries
    color: var(--chart-2)
    subcategories:
      - Supermarket
      - Specialty grocery
      - Produce
      - Convenience store
      - Bread
  transport:
    name: Transport
    aliases:
      - Transport
    color: var(--chart-3)
    subcategories:
      - Public Transport
      - Ride Hailing
      - Bike sharing
      - Transit
      - Ride-hailing
    match_rules:
      - pattern: \b(?:MRT|SMRT|BUS|PUBLIC TRANSPORT|EZ.?LINK|SIMPLYGO)\b
        name: Transit
      - pattern: \b(?:RIDE.?HAIL|TAXI|GOJEK|RYDE|UBER)\b
        name: Ride Hailing
  shopping:
    name: Shopping
    aliases:
      - Shopping
    color: var(--chart-4)
    subcategories: [] # Amount-band names below provide the dropdown options.
    amount_bands:
      - min: 50
        name: Big purchases ($50+)
      - min: 0
        name: Other purchases (<$50)
  entertainment:
    name: Entertainment
    aliases:
      - Entertainment
    color: var(--chart-5)
    subcategories:
      - Digital books
      - Subscription
      - Apps and subscriptions
      - Cinema
      - Music subscription
      - Comedy show
  travel:
    name: Travel
    aliases:
      - Travel
    color: var(--chart-6)
    subcategories:
      - Booking
      - Airfare
      - Lodging
      - Activities
  bills:
    name: Bills
    aliases:
      - Bills
    color: oklch(0.7 0.2 345)
    subcategories:
      - Mobile Plan
      - Cloud Subscription
      - Streaming Subscription
      - Software Subscription
      - Software subscription
      - Mobile
      - Insurance
      - Internet
  gym:
    name: Gym
    aliases:
      - Gym
    color: oklch(0.7 0.16 220)
    subcategories:
      - Fitness & Supplements
      - Fitness membership
  education:
    name: Education & Work
    aliases:
      - Education & Work
    color: oklch(0.75 0.2 55)
    subcategories:
      - Digital services
      - Cloud hosting
      - Software subscription
      - Professional subscription
      - Campus supplies
      - Campus services
  healthcare:
    name: Healthcare
    aliases:
      - Healthcare
    color: oklch(0.7 0.16 165)
    subcategories:
      - Medical
      - Mental health
  cash:
    name: Cash
    aliases:
      - Cash
    color: oklch(0.65 0.16 280)
    subcategories:
      - Cash withdrawal
    default_subcategory: Cash withdrawal
  relationship_transfer:
    name: Transfer to Relationship Account
    aliases:
      - Transfer to Relationship Account
    color: oklch(0.75 0.15 95)
    subcategories:
      - Relationship transfer
    default_subcategory: Relationship transfer
  people_transfer:
    name: Transfers to People
    aliases:
      - Transfers to People
      - Transfer to Friends/Others
    color: oklch(0.7 0.12 15)
    subcategories:
      - Person transfer
    default_subcategory: Person transfer
  unclassified_transfer:
    name: Unclassified Transfers
    aliases:
      - Unclassified Transfers
    color: oklch(0.7 0.11 240)
    subcategories:
      - Unclassified transfer
    default_subcategory: Unclassified transfer
  pending_paylah:
    name: Pending PayLah detail
    aliases:
      - Pending PayLah detail
    color: oklch(0.65 0.06 65)
    subcategories:
      - Pending detail
    default_subcategory: Pending detail
  fees:
    name: Fees
    aliases:
      - Fees
    color: oklch(0.7 0.1 310)
    subcategories:
      - Bank fee
    default_subcategory: Bank fee
  uncategorized:
    name: Uncategorized
    aliases:
      - Uncategorized
    color: var(--chart-muted)
    subcategories:
      - Other
classification_rules:
  - pattern: \bFOMO PAY\b
    category: unclassified_transfer
    role: transfer_to_person
    review_note: Payment processor; underlying merchant unknown
  - pattern: \b(?:PROTEIN|CREATINE|GYM|FITNESS|WORKOUT)\b
    category: gym
    subcategory: Fitness & Supplements
    role: expense
  - pattern: \b(?:MOBILE|TELCO|BROADBAND|INTERNET|UTILITY|ELECTRICITY|INSURANCE)\b
    category: bills
    role: expense
    recurring: true
